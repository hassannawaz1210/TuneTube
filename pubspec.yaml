name: tunetube
description: "Discover and listen to music from YouTube."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio_background: ^0.0.1-beta.17
  just_audio: ^0.9.46
  youtube_explode_dart: ^3.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/icon/
